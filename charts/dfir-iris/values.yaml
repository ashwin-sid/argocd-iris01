customer:
  id: cust000

image:
  repository: ghcr.io/dfir-iris/iriswebapp_app
  tag: v2.4.29
  pullPolicy: IfNotPresent

databaseImage:
  repository: ghcr.io/dfir-iris/iriswebapp_db
  tag: v2.4.29
  pullPolicy: IfNotPresent

rabbitmq:
  image: rabbitmq:3-management-alpine

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  host: iris.example.internal
  annotations: {}
  tls: []

persistence:
  storageClass: ""
  database:
    size: 10Gi
    accessMode: ReadWriteOnce
  shared:
    size: 20Gi
    accessMode: ReadWriteOnce

secrets:
  create: true
  existingSecret: iris-secrets
  # DEVELOPMENT/BOOTSTRAP PLACEHOLDERS ONLY.
  # Replace for production or set create=false and provide existingSecret.
  postgresPassword: CHANGEME-postgres
  postgresAdminPassword: CHANGEME-admin-db
  irisSecretKey: CHANGEME-iris-secret-key
  irisSecurityPasswordSalt: CHANGEME-password-salt
  irisAdminPassword: CHANGEME-iris-admin

iris:
  postgresUser: postgres
  postgresAdminUser: raptor
  postgresDatabase: iris_db
  authenticationType: local
  logLevel: info

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

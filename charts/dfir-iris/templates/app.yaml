apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "dfir-iris.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "dfir-iris.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: iris
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - nohup
            - ./iris-entrypoint.sh
            - iriswebapp
          env:
            - name: LOG_LEVEL
              value: {{ .Values.iris.logLevel | quote }}
            - name: DOCKERIZED
              value: "1"
            - name: POSTGRES_USER
              value: {{ .Values.iris.postgresUser | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfir-iris.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_ADMIN_USER
              value: {{ .Values.iris.postgresAdminUser | quote }}
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfir-iris.secretName" . }}
                  key: POSTGRES_ADMIN_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.iris.postgresDatabase | quote }}
            - name: POSTGRES_SERVER
              value: {{ printf "%s-db" .Release.Name | quote }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: CELERY_BROKER
              value: {{ printf "amqp://%s-rabbitmq" .Release.Name | quote }}
            - name: IRIS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfir-iris.secretName" . }}
                  key: IRIS_SECRET_KEY
            - name: IRIS_SECURITY_PASSWORD_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfir-iris.secretName" . }}
                  key: IRIS_SECURITY_PASSWORD_SALT
            - name: IRIS_ADM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfir-iris.secretName" . }}
                  key: IRIS_ADM_PASSWORD
            - name: IRIS_AUTHENTICATION_TYPE
              value: {{ .Values.iris.authenticationType | quote }}
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: shared
              mountPath: /home/iris/downloads
              subPath: downloads
            - name: shared
              mountPath: /home/iris/user_templates
              subPath: user_templates
            - name: shared
              mountPath: /home/iris/server_data
              subPath: server_data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-shared
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "dfir-iris.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
